name: CLA Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  statuses: write
  pull-requests: write

jobs:
  check-cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check signatures.json for PR author
        uses: actions/github-script@v7
        env:
          CLA_READ_TOKEN: ${{ secrets.CLA_READ_TOKEN }}
        with:
          script: |
            const CLA_VERSION = '1.0';
            const MARKER = '<!-- cla-check -->';
            const author = context.payload.pull_request.user.login;
            const headSha = context.payload.pull_request.head.sha;
            const prNumber = context.payload.pull_request.number;
            const signUrl = `https://trailblazerlabs.salesforce.com/cla/?repo=${context.repo.owner}/${context.repo.repo}&pr=${prNumber}`;

            const res = await fetch(
              'https://api.github.com/repos/TrailblazerLabs/cla-signatures/contents/signatures.json',
              {
                headers: {
                  Authorization: `Bearer ${process.env.CLA_READ_TOKEN}`,
                  Accept: 'application/vnd.github.raw',
                  'User-Agent': 'cla-check-workflow',
                },
              }
            );
            if (!res.ok) {
              core.setFailed(`Could not read signatures.json: ${res.status}`);
              return;
            }
            const data = await res.json();
            const signed = (data.signatures || []).some(
              (s) => (s.login || '').toLowerCase() === author.toLowerCase() && s.claVersion === CLA_VERSION
            );

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: headSha,
              state: signed ? 'success' : 'failure',
              context: 'cla/signed',
              description: signed
                ? `@${author} has signed the CLA`
                : `@${author} needs to sign the CLA before this PR can be merged`,
              target_url: signUrl,
            });

            const body = signed
              ? `${MARKER}\n Thanks @${author} — your Trailblazer Labs CLA signature is on file. This pull request is cleared to merge.`
              : `${MARKER}\n Thanks for your contribution, @${author}! Before this pull request can be merged, you need to sign the Trailblazer Labs Contributor License Agreement.\n\n**[Sign the CLA here](${signUrl})**\n\nYou only need to sign once — it covers every Trailblazer Labs repository. After signing, push a new commit or re-run the check and this status will update automatically.`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.data.find((c) => (c.body || '').includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
